server {
    # Listen directives are dynamically generated by configure-listen.sh
    # to support IPv6 detection on read-only filesystems.
    include /tmp/listen.conf;

    server_name localhost;

    # This allows both HTTP/2 and HTTP/1.1 connections on the same plain-text port
    http2 on;

    root /dist;
    index index.html;
    charset utf-8;

    # Enable gzip compression
    gzip on;
    gzip_static on;

    include /etc/nginx/security_headers.conf;

    # Cache static assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security_headers.conf;
    }

    # Set no-cache for the index.html
    # so that browsers always check for a new copy of Element Admin.
    location / {
        add_header Cache-Control "no-cache";
        index index.runtime.html index.html;
        try_files $uri $uri/ /;
        include /etc/nginx/security_headers.conf;
    }

    location = /health {
        allow all;
        default_type 'application/json';
        return 200 '{"status": "ok"}';
    }

    error_page 500 502 503 504 /50x.html;
}
