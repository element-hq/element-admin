trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - undici-types@6.21.0

strictDepBuilds: true

ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    eslint: "10"
    "@vector-im/compound-design-tokens": "7"
