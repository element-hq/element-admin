# $schema: https://www.schemastore.org/pnpm-workspace.json

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - undici-types@6.21.0

strictDepBuilds: true

allowBuilds:
  esbuild: false
  # msw's postinstall only copies `mockServiceWorker.js` into `public/`; the
  # tests use `@msw/playwright`, which intercepts in the test process, so the
  # browser worker script is never needed.
  msw: false
  unrs-resolver: false

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    eslint: "10"
    "@vector-im/compound-design-tokens": "8"
    vite: "8"
    typescript: "7"
